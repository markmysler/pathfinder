<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1116" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Pathfinder</title>
    <meta
      name="description"
      content="Learn graph search by watching algorithms route across real streets: BFS, Dijkstra, A*, contraction hierarchies and more, step by step."
    />
    <!-- The card shown when a link is shared. Crawlers need absolute URLs, so these name the live
         site. The image is a JPEG so the service worker's precache, which takes PNGs, leaves it out. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pathfinder" />
    <meta
      property="og:title"
      content="Pathfinder: watch graph-search algorithms route across real streets"
    />
    <meta
      property="og:description"
      content="BFS, Dijkstra, A* and more, racing side by side on OpenStreetMap, with an article for every algorithm."
    />
    <meta property="og:url" content="https://markmysler.github.io/pathfinder/" />
    <meta
      property="og:image"
      content="https://markmysler.github.io/pathfinder/social-preview.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Greedy best-first, Dijkstra and A* searching from the Cabildo to the Casa Rosada side by side"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The fonts the first screen uses, fetched with the page so text never reflows when they arrive. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"

    <link

      as="font"
      type="font/woff2"
      crossorigin
    />

    <div id="root"></div>

  </body>
</html>
